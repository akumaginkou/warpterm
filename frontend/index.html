<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>warpterm</title>
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <button id="warp-toggle" class="pill">WARP …</button>
        <span id="egress" class="egress">egress: —</span>
        <span class="spacer"></span>
        <label class="chk" title="force ALL programs through WARP (Linux)">
          <input type="checkbox" id="transparent" /> transparent
        </label>
        <select id="account" title="egress account"></select>
        <button id="rotate" title="new egress IP">⟳ rotate</button>
        <button id="split-right" title="split right (Ctrl+Shift+D)">◫</button>
        <button id="split-down" title="split down (Ctrl+Shift+E)">⊟</button>
        <button id="gear" title="settings">⚙</button>
      </header>
      <div id="settings" class="panel" hidden>
        <label>Font size <input type="number" id="set-font" min="6" max="48" /></label>
        <label
          >Font
          <select id="set-font-family">
            <option value="ui-monospace, Menlo, Consolas, monospace">System mono</option>
            <option value="'DejaVu Sans Mono', monospace">DejaVu Sans Mono</option>
            <option value="'Liberation Mono', monospace">Liberation Mono</option>
            <option value="'Noto Sans Mono', monospace">Noto Sans Mono</option>
            <option value="'Courier New', monospace">Courier</option>
          </select></label
        >
        <label
          >Cursor
          <select id="set-cursor">
            <option value="bar">bar</option>
            <option value="block">block</option>
            <option value="underline">underline</option>
          </select></label
        >
        <label>Scrollback <input type="number" id="set-scrollback" min="100" max="100000" step="100" /></label>
        <label
          >Theme
          <select id="set-theme">
            <option value="dark">dark</option>
            <option value="light">light</option>
          </select></label
        >
        <label><input type="checkbox" id="set-transparent" /> transparent by default</label>
        <label><input type="checkbox" id="set-copy-on-select" /> copy on select</label>
        <label
          >Accounts <input type="number" id="set-accounts" min="1" max="8" />
          <span class="hint">(next launch)</span></label
        >
        <div class="profiles">
          <div class="phead">
            <span>Launch profiles</span>
            <button id="add-profile" title="add a profile">+</button>
          </div>
          <div id="profiles-list"></div>
        </div>
      </div>
      <nav id="tabs"></nav>
      <div id="panes">
        <div id="search" hidden>
          <input id="search-input" type="text" placeholder="Find…" spellcheck="false" />
          <button id="search-prev" title="previous (Shift+Enter)">↑</button>
          <button id="search-next" title="next (Enter)">↓</button>
          <button id="search-close" title="close (Esc)">×</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
